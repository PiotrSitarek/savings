name: Aktualizacja ceny VWCE

on:
  schedule:
    - cron: "0 16 * * 5"
  workflow_dispatch:

jobs:
  update-price:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz aktualną cenę
        run: python scripts/fetch-price.py

      - name: Commit i push jeśli cena się zmieniła
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --cached --quiet || git commit -m "Aktualizacja ceny VWCE $(date +%Y-%m-%d)"
          git push
